  <form [formGroup]="form" class="custom-form">
    <div class="container mt-5">
    <div class="row">
      <div class="col-md-12 mt-3">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Card Owner Name</mat-label>
          <input matInput placeholder="Ex. Daneil" formControlName="cardOrnerName">
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12 mt-3">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Card Owner Number</mat-label>
          <input matInput placeholder="XXXX-XXXX-XXXX-XXXX" formControlName="cardOrnernumber">
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12 mt-3">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Expiration Date</mat-label>
          <input matInput placeholder="MM/YY" formControlName="ExpirationDate">
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mt-3">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Security Code</mat-label>
          <input type="password" matInput placeholder="***" formControlName="securityDate">
        </mat-form-field>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-12 text-center">
        <button class="mx-3" mat-flat-button color="primary" type="button" (click)="onSubmit()">Submit</button>
        <button mat-flat-button color="warn" type="button" (click)="resetForm()">Cancel</button>
      </div>
    </div>
    </div>
  </form>
